{% extends "base.html" %}
{% block title %}Feedback{% endblock %}
{% block heading %}Feedback{% endblock %}
{% block content %}
<article class="card narrow">
  <h2>Tell us what you think</h2>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="rating">Rating (optional)</label>
      <select id="rating" name="rating"><option value="">No rating</option>{% for i in range(5, 0, -1) %}<option value="{{ i }}" {{ 'selected' if form.get('rating') == i|string }}>{{ i }} / 5</option>{% endfor %}</select>
      {% if errors.get('rating') %}<span class="field-error">{{ errors['rating'] }}</span>{% endif %}</div>
    <div class="field"><label for="message">Your feedback</label>
      <textarea id="message" name="message" rows="6" maxlength="2000" required>{{ form.get('message','') }}</textarea>
      {% if errors.get('message') %}<span class="field-error">{{ errors['message'] }}</span>{% endif %}</div>
    <button class="btn btn-primary" type="submit">Send feedback</button>
  </form>
</article>
{% endblock %}
