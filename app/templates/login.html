{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="muted">Log in to continue your quizzes.</p>
{% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" novalidate data-validate="login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="identifier">Username or Email</label>
    <input id="identifier" name="identifier" type="text" value="{{ identifier }}" autocomplete="username" required autofocus></div>
  <div class="field"><label for="password">Password</label>
    <div class="input-group"><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="button" class="btn btn-ghost" data-toggle-password="password">Show</button></div></div>
  <label class="check"><input type="checkbox" name="remember"> Remember me</label>
  <button class="btn btn-primary btn-block" type="submit">Login</button>
</form>
<p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
